[project]
name = "fem-beam-foundations"
version = "0.0.0"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [  
"pytest", 
"pytest-cov"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]